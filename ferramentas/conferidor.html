<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; form-action 'none'; base-uri 'none'; script-src 'sha256-C3l3Y3J0eacp12OWkAFZ7Bvh5HAonH7zGliSdxHDMtQ='; style-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conferidor de Alterações</title>
<style>/* Sistema visual aprovado na rodada de design (T4.0; AGENTS.md, Design; ferramentas/design/rodada-2.html).
   Cores com nome de papel, nunca de aparência. Estado sempre com cor + forma + palavra. */
:root {
  --fundo: #f4f3ef; --superficie: #ffffff; --superficie-2: #f9f8f5; --texto: #1c1c1a; --texto-suave: #5d5b55; --borda: #d9d6cd;
  --acao-primaria: #1f4e8c; --acao-texto: #ffffff;
  --erro: #a3201c; --erro-fundo: #fbe8e6; --alerta: #8a5a00; --alerta-fundo: #fdf1d8;
  --ok: #1d6b3a; --ok-fundo: #e4f2e8; --info: #2f5f8a; --info-fundo: #e6eef7; --pendente: #5d5b55; --pendente-fundo: #ecebe6;
  --removido: #a3201c; --removido-fundo: #fbe1de; --inserido: #1b5e8f; --inserido-fundo: #e1edf8;
  --raio: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fundo: #151514; --superficie: #1f1f1d; --superficie-2: #262624; --texto: #ecebe6; --texto-suave: #a8a69e; --borda: #3a3936;
    --acao-primaria: #8db4ea; --acao-texto: #10213a;
    --erro: #f2a097; --erro-fundo: #3a1916; --alerta: #f0c56a; --alerta-fundo: #33270e; --ok: #8fd3a5; --ok-fundo: #173222;
    --info: #9cc0e6; --info-fundo: #1a2a3b; --pendente: #b8b6ae; --pendente-fundo: #2c2b28;
    --removido: #f2a097; --removido-fundo: #3a1b18; --inserido: #9cc8f0; --inserido-fundo: #1b2c3e;
  }
}
* { box-sizing: border-box; }
/* Escondido é escondido: nenhum estilo de componente (ex.: botão com display próprio) pode vencer. */
[hidden] { display: none !important; }
body { margin: 0; background: var(--fundo); color: var(--texto); font: 16px/1.55 "Segoe UI", system-ui, sans-serif; }
h1, h2, h3 { line-height: 1.25; margin: 0; }
a { color: var(--acao-primaria); }
:focus-visible { outline: 3px solid var(--acao-primaria); outline-offset: 2px; }

.tela { max-width: 1000px; margin: 0 auto; padding: 28px 16px 48px; }
.tela > header { margin-bottom: 20px; }
.tela h1 { font-size: 1.9rem; overflow-wrap: anywhere; }
.descricao { color: var(--texto-suave); margin: 6px 0 0; }
.rodape { max-width: 1000px; margin: 0 auto; padding: 0 16px 24px; color: var(--texto-suave); font-size: 0.85rem; }
.voltar { display: inline-block; margin-bottom: 12px; }

/* Botões: o que pede algo da pessoa é principal; o resto é discreto. */
button, .botao { font: inherit; font-size: 0.95rem; padding: 7px 14px; border-radius: var(--raio); border: 1px solid var(--acao-primaria); background: var(--superficie); color: var(--acao-primaria); cursor: pointer; text-decoration: none; display: inline-block; }
.botao-principal { background: var(--acao-primaria); color: var(--acao-texto); }
.botao-perigo { border-color: var(--erro); color: var(--erro); }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Selos de estado: cor + forma + palavra. */
.selo { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 600; padding: 2px 8px 2px 4px; border-radius: 999px; }
.selo .forma { display: inline-grid; place-items: center; width: 18px; height: 18px; font-size: 0.75rem; font-weight: 700; flex: none; }
.selo-erro { background: var(--erro-fundo); color: var(--erro); } .selo-erro .forma { background: var(--erro); color: var(--erro-fundo); border-radius: 3px; }
.selo-aviso { background: var(--alerta-fundo); color: var(--alerta); } .selo-aviso .forma { background: var(--alerta); color: var(--alerta-fundo); clip-path: polygon(50% 0, 100% 100%, 0 100%); padding-top: 4px; }
.selo-ok { background: var(--ok-fundo); color: var(--ok); } .selo-ok .forma { background: var(--ok); color: var(--ok-fundo); border-radius: 50%; }
.selo-info { background: var(--info-fundo); color: var(--info); } .selo-info .forma { border: 2px solid var(--info); border-radius: 50%; }
.selo-pendente { background: var(--pendente-fundo); color: var(--pendente); } .selo-pendente .forma { border: 2px dashed var(--pendente); border-radius: 50%; }

/* Avisos de página */
.aviso-pagina { border-radius: var(--raio); padding: 12px 14px; margin: 14px 0 16px; border-left: 5px solid var(--alerta); background: var(--alerta-fundo); }
.aviso-pagina strong { display: block; }
.aviso-pagina small { color: var(--texto-suave); }
.aviso-fixo { color: var(--texto-suave); font-size: 0.9rem; }
.mensagem-erro { color: var(--erro); font-weight: 600; margin: 6px 0 0; }

/* Formulário curto */
.formulario { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio); padding: 16px; margin: 0 0 16px; }
.formulario label { display: block; font-weight: 600; margin-bottom: 6px; }
.formulario input[type=text] { font: inherit; width: 100%; max-width: 560px; padding: 8px 10px; border: 1px solid var(--borda); border-radius: var(--raio); background: var(--superficie); color: var(--texto); margin-bottom: 10px; }

/* Lista de verificações (Início) */
.lista-verificacoes { list-style: none; margin: 0; padding: 0; background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio); }
.lista-verificacoes li { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--borda); }
.lista-verificacoes li:last-child { border-bottom: 0; }
.lista-verificacoes .nome { font-weight: 600; overflow-wrap: anywhere; }
.lista-verificacoes .meta { color: var(--texto-suave); font-size: 0.88rem; grid-column: 1; }
.lista-verificacoes .situacao { grid-column: 1; }
.lista-verificacoes .acoes { grid-column: 2; grid-row: 1 / span 4; }
.vazio { background: var(--superficie); border: 1px dashed var(--borda); border-radius: var(--raio); padding: 20px; color: var(--texto-suave); }

/* Ação discreta (ex.: "Ver resultado" de tópico íntegro, "Renomear"): parece link. */
.acao-discreta { background: none; border: 0; padding: 4px 2px; color: var(--acao-primaria); text-decoration: underline; text-underline-offset: 3px; font: inherit; font-size: 0.95rem; cursor: pointer; }

/* Verificação (T4.2) */
.titulo-com-acao { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.veredito { font-size: 1.2rem; font-weight: 700; margin: 12px 0 4px; }
.capa { display: grid; grid-template-columns: 1fr 270px; gap: 28px; align-items: start; }
.progresso { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio); padding: 16px; position: sticky; top: 12px; }
.progresso .barra { height: 10px; border-radius: 999px; background: var(--pendente-fundo); overflow: hidden; display: flex; margin: 10px 0; }
.progresso .barra span { display: block; height: 100%; }
.progresso .legenda { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; font-size: 0.9rem; }
.sumario { list-style: none; margin: 16px 0 0; padding: 0; background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio); }
.sumario li { display: grid; grid-template-columns: 24px 1fr auto auto; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--borda); }
.sumario li:last-child { border-bottom: 0; }
.sumario .nome { min-width: 0; overflow-wrap: anywhere; }
.sumario .situacao { font-weight: 600; font-size: 0.92rem; white-space: nowrap; }
.sumario .botao { font-size: 0.88rem; padding: 5px 12px; white-space: nowrap; }
.sumario .organizar { display: flex; gap: 6px; flex-wrap: wrap; }
.sumario .organizar button { font-size: 0.85rem; padding: 4px 10px; }
.sumario .organizar button:disabled { opacity: 0.45; cursor: default; }
.forma-margem { font-weight: 700; text-align: center; }
.m-erro { color: var(--erro); } .m-aviso { color: var(--alerta); } .m-ok { color: var(--ok); } .m-info { color: var(--info); } .m-pendente { color: var(--pendente); }

.sumario .renomear-topico { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-width: 0; }
.sumario .renomear-topico input { font: inherit; flex: 1 1 200px; min-width: 0; padding: 5px 8px; border: 1px solid var(--borda); border-radius: var(--raio); background: var(--superficie); color: var(--texto); }

/* Adicionar tópico (T4.3) */
.instrucao { margin: 0 0 12px; }
.zona-colar { display: grid; gap: 4px; place-items: center; text-align: center; padding: 32px 16px; border: 2px dashed var(--acao-primaria); border-radius: var(--raio); background: var(--superficie); cursor: text; }
.zona-colar:focus { border-style: solid; }
.barra-fixa { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio); padding: 10px 14px; margin: 0 0 12px; }
.contador { margin: 0; font-weight: 600; }
.folha { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio); padding: 20px 24px; line-height: 1.7; }
.grupo-item { border-left: 3px solid var(--borda); padding: 2px 0 4px 12px; margin: 0 0 14px; }
.titulo-item { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-weight: 700; margin: 0 0 4px; }
.titulo-item label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.titulo-item .estado { font-weight: 400; font-size: 0.88rem; color: var(--info); }
.titulo-item input, .par-marcavel input { width: 18px; height: 18px; flex: none; margin-top: 4px; }
.par-marcavel label { display: flex; gap: 10px; align-items: flex-start; padding: 2px 8px; border-radius: 4px; cursor: pointer; overflow-wrap: anywhere; }
.par-marcavel.liberado label { background: var(--info-fundo); box-shadow: inset 4px 0 0 var(--info); }
.par-marcavel label:hover { outline: 1px dashed var(--info); }
.dobra { display: block; width: 100%; margin: 6px 0; text-align: center; border: 1px dashed var(--borda); background: none; color: var(--texto-suave); }

/* Resultado (T4.5): documento anotado, estilo controle de alterações do Word. */
del { color: var(--removido); background: var(--removido-fundo); text-decoration: line-through; text-decoration-thickness: 2px; }
ins { color: var(--inserido); background: var(--inserido-fundo); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.contagem { display: flex; gap: 10px; flex-wrap: wrap; }
.folha-resultado { padding: 24px 32px 24px 64px; font-size: 1.02rem; line-height: 1.75; }
.folha-resultado .par { position: relative; margin: 0 0 10px; padding: 2px 10px; border-radius: 4px; overflow-wrap: anywhere; }
.folha-resultado .par.igual { color: var(--texto-suave); }
.folha-resultado .par.erro { background: color-mix(in srgb, var(--erro-fundo) 60%, transparent); box-shadow: inset 4px 0 0 var(--erro); }
.folha-resultado .par.aviso { background: color-mix(in srgb, var(--alerta-fundo) 70%, transparent); box-shadow: inset 4px 0 0 var(--alerta); }
.folha-resultado .par.info { background: var(--info-fundo); box-shadow: inset 4px 0 0 var(--info); }
.folha-resultado .par:focus { outline: 3px solid var(--acao-primaria); outline-offset: 2px; }
.folha-resultado .forma-margem { position: absolute; left: -44px; top: 4px; width: 26px; height: 26px; display: grid; place-items: center; font-size: 0.85rem; }
.folha-resultado .f-erro { background: var(--erro); color: var(--erro-fundo); border-radius: 4px; }
.folha-resultado .f-aviso { background: var(--alerta); color: var(--alerta-fundo); clip-path: polygon(50% 0, 100% 100%, 0 100%); padding-top: 6px; }
.folha-resultado .f-info { border: 2px solid var(--info); color: var(--info); border-radius: 50%; }
.folha-resultado .cabeca { font-size: 0.85rem; font-weight: 600; margin: 4px 0 2px; }
.folha-resultado .cabeca .onde { color: var(--texto-suave); font-weight: 400; }
.acoes-bloco { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; margin: 6px 0 4px; }
.acoes-bloco button { font-size: 0.85rem; padding: 4px 10px; }
.resposta-copia { font-size: 0.88rem; color: var(--texto-suave); display: grid; gap: 4px; flex: 1 1 260px; }
.resposta-copia textarea { font: inherit; width: 100%; padding: 6px 8px; border: 1px solid var(--borda); border-radius: var(--raio); background: var(--superficie); color: var(--texto); }

@media (max-width: 720px) {
  .tela h1 { font-size: 1.5rem; }
  .folha { padding: 14px 10px; }
  .folha-resultado { padding: 14px 10px 14px 40px; }
  .folha-resultado .forma-margem { left: -32px; width: 22px; height: 22px; }
  .lista-verificacoes li { grid-template-columns: 1fr; }
  .lista-verificacoes .acoes { grid-column: 1; grid-row: auto; }
  .capa { grid-template-columns: 1fr; }
  .progresso { position: static; order: -1; }
  .sumario li { grid-template-columns: 22px 1fr; }
  .sumario .situacao, .sumario .botao, .sumario .acao-discreta, .sumario .organizar { grid-column: 2; justify-self: start; white-space: normal; }
}

/* Impressão (T4.6): só o documento; estado continua em cor + forma + palavra. */
.so-impressao { display: none; }
@media print {
  @page { margin: 16mm 14mm; }
  body { background: #fff; color: #000; font-size: 11pt; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .so-impressao { display: block; color: #333; font-size: 9.5pt; margin: 0 0 6px; }
  .so-tela { display: none; }
  button:not([data-dobra]), .botao, .acao-discreta, .voltar, .acoes, .acoes-bloco, .zona-colar, form { display: none !important; }
  .dobra { border: 0; padding: 2px 0; margin: 4px 0; text-align: left; font-style: italic; color: #555; }
  .tela { max-width: none; padding: 0; }
  .barra-fixa, .progresso { position: static; }
  .capa { grid-template-columns: 1fr; }
  .progresso { order: -1; }
  .folha { border: 0; padding-left: 40px; }
  .folha-resultado .par, .sumario li, .lista-verificacoes li, .progresso { break-inside: avoid; }
  h1, h2, .veredito, .barra-fixa { break-after: avoid; }
}

/* Pós-MVP: trecho cuja formatação mudou, e os itens seguintes de um grupo de renumeração. */
mark.mudou-formatacao { background: var(--alerta-fundo); color: var(--texto); outline: 2px dashed var(--alerta); outline-offset: 1px; border-radius: 2px; }
.folha-resultado .par.grupo-renumerado { box-shadow: inset 4px 0 0 var(--borda); }
.folha-resultado .par.grupo-renumerado .cabeca { color: var(--texto-suave); font-size: 0.85rem; }
.escolha-arquivo { margin-top: 10px; color: var(--texto-suave); font-size: 0.95rem; }
.escolha-arquivo .acao-discreta { font-size: inherit; }
.mensagem-arquivo { margin: 6px 0 0; color: var(--texto); }
.mensagem-arquivo:empty { display: none; }
.acoes-em-lote { margin: 0 0 10px; }
.mensagem-inicio { margin: 0 0 10px; }
.mensagem-inicio:empty { display: none; }
.lista-verificacoes .antiga { grid-column: 1; color: var(--alerta); font-size: 0.9rem; }
</style>

<script>'use strict';
(() => {
// ---- src/dominio/ancoras.js ----
const { encontrarAncoras } = (() => {
// Âncoras do pareamento antes × depois (plano, seção 6.3, passo 1). Função pura.
//
// encontrarAncoras(textosAntes, textosDepois) → [[i, j], ...]
//   Pares de parágrafos IDÊNTICOS, em ordem crescente dos dois lados, no maior número possível
//   (maior subsequência comum). É o que faz a comparação ser por conteúdo, não por posição:
//   um parágrafo inserido no começo não desloca nada.
//
// Garantia que nunca pode quebrar: só texto idêntico vira âncora. Achar menos âncoras é
// seguro (mais coisa vai para as lacunas e é examinada); âncora errada nunca.
//
// preferidos (opcional): índices do antes a ancorar de preferência — os protegidos. Entre as
// soluções com o máximo de âncoras, escolhe a que cobre mais preferidos. Motivo: com gêmeos
// idênticos ("UN" repetido na tabela), apagar o liberado não pode acusar o protegido.

// Acima disto (parágrafos do miolo antes × depois), troca o alinhamento completo por um mais leve.
const LIMITE_CELULAS = 16_000_000;

function exigirListaDeTextos(valor, nome) {
  if (!Array.isArray(valor) || valor.some(t => typeof t !== 'string')) {
    throw new TypeError(`encontrarAncoras espera uma lista de textos em "${nome}".`);
  }
}

// Alinhamento completo (maior subsequência comum) entre a[ai..af) e b[bi..bf).
// Com preferidos, cada âncora vale K (ou K + 1 se preferida), com K maior que o número de
// parágrafos: maximizar o total maximiza primeiro o número de âncoras, depois os preferidos.
function alinharCompleto(a, ai, af, b, bi, bf, preferido, saida) {
  const n = af - ai;
  const m = bf - bi;
  const largura = m + 1;
  const K = preferido ? n + 1 : 1;
  const peso = (i) => (preferido && preferido[ai + i] ? K + 1 : K);
  const Tipo = !preferido && Math.min(n, m) < 65535 ? Uint16Array : Uint32Array;
  const tabela = new Tipo((n + 1) * largura);
  for (let i = n - 1; i >= 0; i--) {
    const p = peso(i);
    for (let j = m - 1; j >= 0; j--) {
      const semPar = Math.max(tabela[(i + 1) * largura + j], tabela[i * largura + j + 1]);
      tabela[i * largura + j] = a[ai + i] === b[bi + j]
        ? Math.max(semPar, tabela[(i + 1) * largura + j + 1] + p)
        : semPar;
    }
  }
  let i = 0;
  let j = 0;
  while (i < n && j < m) {
    if (a[ai + i] === b[bi + j] && tabela[i * largura + j] === tabela[(i + 1) * largura + j + 1] + peso(i)) {
      saida.push([ai + i, bi + j]);
      i++;
      j++;
    } else if (tabela[(i + 1) * largura + j] >= tabela[i * largura + j + 1]) i++;
    else j++;
  }
}

// Maior sequência de pares com j crescente (pares já em ordem de i).
function maiorCrescente(pares) {
  const pontas = [];
  const anterior = new Array(pares.length);
  for (let k = 0; k < pares.length; k++) {
    const j = pares[k][1];
    let baixo = 0;
    let alto = pontas.length;
    while (baixo < alto) {
      const meio = (baixo + alto) >> 1;
      if (pares[pontas[meio]][1] < j) baixo = meio + 1;
      else alto = meio;
    }
    anterior[k] = baixo > 0 ? pontas[baixo - 1] : -1;
    pontas[baixo] = k;
  }
  const resultado = [];
  for (let k = pontas.length ? pontas[pontas.length - 1] : -1; k !== -1; k = anterior[k]) resultado.push(pares[k]);
  return resultado.reverse();
}

// Alinhamento leve para miolos gigantes: ancora só parágrafos que aparecem uma única vez em
// cada lado, na maior ordem crescente possível, e repete o processo entre essas âncoras.
function alinharLeve(a, ai, af, b, bi, bf, preferido, saida) {
  const contaA = new Map();
  const contaB = new Map();
  const posicaoB = new Map();
  for (let i = ai; i < af; i++) contaA.set(a[i], (contaA.get(a[i]) || 0) + 1);
  for (let j = bi; j < bf; j++) {
    contaB.set(b[j], (contaB.get(b[j]) || 0) + 1);
    posicaoB.set(b[j], j);
  }
  const unicos = [];
  for (let i = ai; i < af; i++) {
    if (contaA.get(a[i]) === 1 && contaB.get(a[i]) === 1) unicos.push([i, posicaoB.get(a[i])]);
  }
  let deA = ai;
  let deB = bi;
  for (const [i, j] of maiorCrescente(unicos)) {
    ancorar(a, deA, i, b, deB, j, preferido, saida);
    saida.push([i, j]);
    deA = i + 1;
    deB = j + 1;
  }
  if (deA !== ai || deB !== bi) ancorar(a, deA, af, b, deB, bf, preferido, saida);
}

// Aparar começo e fim iguais é ótimo, mas com preferência só enquanto o parágrafo é preferido:
// um liberado no começo pode ter um gêmeo protegido mais adiante que deve ficar com a âncora.
function ancorar(a, ai, af, b, bi, bf, preferido, saida) {
  const podeAparar = (i) => !preferido || preferido[i] === 1;
  while (ai < af && bi < bf && a[ai] === b[bi] && podeAparar(ai)) { saida.push([ai, bi]); ai++; bi++; }
  const final = [];
  while (ai < af && bi < bf && a[af - 1] === b[bf - 1] && podeAparar(af - 1)) { af--; bf--; final.push([af, bf]); }
  if (ai < af && bi < bf) {

const { agruparItens, descendentesDoItem } = (() => {
// Agrupamento de parágrafos em itens e hierarquia (plano, seção 6.2, passos 4 a 7). Funções puras.
//
// Item: { id, tipo, marcador, paragrafos, pai, nivel }
//   id: índice do primeiro parágrafo do item
//   tipo: 'abertura' (antes do primeiro marcador) | 'marcado' (aberto por marcador)
//         | 'solto' (texto sem marcador nenhum: cada parágrafo é um item)
//   paragrafos: índices dos parágrafos do item, em ordem
//   pai: id do item pai, ou null
//
// Item só agrupa para mostrar e marcar vários parágrafos de uma vez (P3). A liberação é
// guardada por parágrafo, nunca por item.

// Quem pode ser pai de quem nos tipos não decimais: um item só fica sob outro de posto menor.
const POSTO = { clausula: 0, artigo: 1, decimal: 1, paragrafo: 2, inciso: 3, alinea: 4 };

function ehPrefixoProprio(curto, longo) {
  return curto.length < longo.length && curto.every((n, i) => n === longo[i]);
}

function encontrarPai(anteriores, marcador) {
  for (let i = anteriores.length - 1; i >= 0; i--) {
    const candidato = anteriores[i];
    if (candidato.tipo !== 'marcado') continue;
    const m = candidato.marcador;
    if (marcador.tipo === 'decimal') {
      if (m.tipo === 'decimal' && ehPrefixoProprio(m.numeros, marcador.numeros)) return candidato;
    } else if (POSTO[m.tipo] < POSTO[marcador.tipo]) {
      return candidato;
    }
  }
  // Decimal sem nenhum prefixo antes: fica sob a cláusula mais próxima, se houver.
  if (marcador.tipo === 'decimal') {
    for (let i = anteriores.length - 1; i >= 0; i--) {
      const candidato = anteriores[i];
      if (candidato.tipo === 'marcado' && candidato.marcador.tipo === 'clausula') return candidato;
    }
  }
  return null;
}

  return { id: indice, tipo, marcador, paragrafos: [indice], pai: pai ? pai.id : null, nivel: pai ? pai.nivel + 1 : 0 };

  const marcadores = paragrafos.map(p => detectarMarcador(p.texto));

  const itens = [];
  paragrafos.forEach((p, i) => {
    const marcador = marcadores[i];
    if (marcador) {
      itens.push(novoItem('marcado', marcador, p.indice, encontrarPai(itens, marcador)));
    } else if (itens.length === 0) {
      itens.push(novoItem('abertura', null, p.indice, null));
    } else {
      itens[itens.length - 1].paragrafos.push(p.indice);
    }
  });

  const porId = new Map(itens.map(i => [i.id, i]));
  return itens
    .filter(item => {
      for (let pai = item.pai; pai !== null; pai = porId.get(pai).pai) {
        if (pai === id) return true;
      }
      return false;
    })
    .map(item => item.id);

})();

  const largura = m + 1;
  const tabela = new Uint32Array((n + 1) * largura);

        : Math.max(tabela[(i + 1) * largura + j], tabela[i * largura + j + 1]);

  let j = 0;

const ASSINATURA_ENTRADA = 0x02014b50;
const ASSINATURA_LOCAL = 0x04034b50;
const MUDANCAS_PENDENTES = new Set(['w:ins', 'w:del', 'w:moveFrom', 'w:moveTo', 'w:rPrChange', 'w:pPrChange', 'w:tblPrChange', 'w:trPrChange', 'w:tcPrChange', 'w:sectPrChange']);

// Lê um arquivo de dentro do ZIP pelo nome; null se não existir.
async function lerDoZip(bytes, procurado) {

    if (dv.getUint32(i, true) === ASSINATURA_FIM_DO_ZIP) { fim = i; break; }

    const tamanhoDoNome = dv.getUint16(p + 28, true);

const MENSAGEM_COLAGEM_SEM_TEXTO = 'A colagem veio sem texto. Confira se copiou o tópico: '
  + 'clique dentro do texto no sistema, aperte Ctrl+A e depois Ctrl+C.';

// Área onde a pessoa clica antes do Ctrl+V. A colagem é ouvida na página inteira (ouvirColagem),
// então funciona mesmo sem clicar aqui.
function criarZonaDeColar(detalhe, idDaInstrucao) {
  return criarElemento('div', { classe: 'zona-colar', tabindex: 0, dados: { zonaColar: '' }, 'aria-describedby': idDaInstrucao },
    criarElemento('strong', { texto: 'Clique aqui e aperte Ctrl+V' }),
    criarElemento('span', { texto: detalhe }));
}

// Ouve a colagem enquanto a tela estiver aberta. "receber({ texto, html })" devolve true se usou a
// colagem (aí o navegador não faz mais nada com ela). Para de ouvir quando a pessoa sai da tela.
function ouvirColagem(contexto, receber) {
  const aoColar = (evento) => {
    if (!evento.clipboardData) return;
    const usou = receber({ texto: evento.clipboardData.getData('text/plain'), html: evento.clipboardData.getData('text/html') });
    if (usou) evento.preventDefault();
  };
  document.addEventListener('paste', aoColar);
  contexto.aoSair(() => document.removeEventListener('paste', aoColar));
}

// Alternativa à colagem (pós-MVP): abrir um arquivo .docx, .txt ou .md. O que o arquivo traz chega
// a "receber({ texto, html })" como se tivesse sido colado. Avisos e erros aparecem logo abaixo.
function criarEscolhaDeArquivo(receber) {
  const mensagem = criarElemento('p', { classe: 'mensagem-arquivo', role: 'status', 'aria-live': 'polite' });
  const entrada = criarElemento('input', {
    type: 'file', accept: '.docx,.txt,.md', hidden: true, dados: { entradaArquivo: '' },
    aoMudar: async () => {
      const arquivo = entrada.files && entrada.files[0];
      entrada.value = '';
      if (!arquivo) return;
      mensagem.textContent = 'Abrindo o arquivo…';
      try {
        const { texto, html, aviso } = await lerArquivoEscolhido(arquivo);
        mensagem.textContent = aviso || '';
        receber({ texto, html, aviso });
      } catch (erro) {
        mensagem.textContent = erro && erro.paraPessoa ? erro.message : 'Não foi possível ler este arquivo.';
      }
    },
  });
  return criarElemento('div', { classe: 'escolha-arquivo' },
    criarElemento('span', { texto: 'Ou ' }),
    criarElemento('button', { type: 'button', classe: 'acao-discreta', texto: 'abra um arquivo (.docx, .txt ou .md)', aoClicar: () => entrada.click() }),
    entrada,
    mensagem);
}

return { MENSAGEM_COLAGEM_SEM_TEXTO, criarZonaDeColar, ouvirColagem, criarEscolhaDeArquivo };
})();
// ---- src/interface/rotulos.js ----
const { rotuloDoItem } = (() => {
// Como cada item aparece para a pessoa ("Item 1.1", "Inciso II", "Alínea a)"...).
// Usado na marcação (T4.3) e no resultado (T4.5).

function rotuloDoItem(item) {
  if (!item || item.tipo === 'abertura') return 'Abertura do tópico';
  if (!item.marcador) return 'Parágrafo';
  const { tipo, rotulo } = item.marcador;
  if (tipo === 'decimal') return `Item ${rotulo.replace(/[.)]$/, '')}`;
  if (tipo === 'inciso') return `Inciso ${rotulo}`;
  if (tipo === 'alinea') return `Alínea ${rotulo}`;
  return rotulo;
}

return { rotuloDoItem };
})();
// ---- src/interface/marcacao.js ----
const { criarMarcacao } = (() => {
// Marcação do que a IA pode alterar (P3): a liberação é por parágrafo; o item agrupa e marca
// vários de uma vez. Usada ao adicionar um tópico (T4.3) e ao ajustar as liberações (T5.3).

// Itens maiores que isto vêm dobrados (a tabela de um TR tem centenas de linhas).
const LINHAS_ANTES_DE_DOBRAR = 14;

// "liberados" é um Set de índices de parágrafo, alterado no lugar a cada clique.
// Devolve o contador (vai na barra fixa da tela) e a folha com os itens e parágrafos.
function criarMarcacao(divisao, liberados) {
  const itens = agruparItens(divisao);
  const total = divisao.paragrafos.length;
  const porIndice = new Map(divisao.paragrafos.map(p => [p.indice, p]));
  const contador = criarElemento('p', { classe: 'contador', dados: { contador: '' }, 'aria-live': 'polite' });
  const grupos = new Map(); // id do item → { caixa, estado, subitens }
  const linhas = new Map(); // índice do parágrafo → { linha, caixa }

  function atualizar() {
    for (const item of itens) {
      const g = grupos.get(item.id);
      const quantos = item.paragrafos.filter(i => liberados.has(i)).length;
      const todo = quantos === item.paragrafos.length;
      g.caixa.checked = todo;
      g.caixa.indeterminate = quantos > 0 && !todo;
      g.estado.textContent = todo ? ' — liberado'
        : quantos ? ` — parcialmente liberado: ${quantos} de ${item.paragrafos.length} linhas` : '';
      const filhos = descendentesDoItem(itens, item.id);
      const faltaFilho = filhos.some(id => itens.find(i => i.id === id).paragrafos.some(p => !liberados.has(p)));
      g.subitens.hidden = !(todo && faltaFilho);
    }
    for (const [indice, { linha, caixa }] of linhas) {
      caixa.checked = liberados.has(indice);
      linha.classList.toggle('liberado', liberados.has(indice));
    }
    contador.textContent = `${liberados.size} de ${total} parágrafos liberados para a IA alterar. Todo o resto fica protegido.`;
  }

  const folha = criarElemento('div', { classe: 'folha folha-marcar' });
  for (const item of itens) {
    const caixa = criarElemento('input', {
      type: 'checkbox',
      aoMudar: () => {
        for (const i of item.paragrafos) (caixa.checked ? liberados.add(i) : liberados.delete(i));
        atualizar();
      },
    });
    const estado = criarElemento('span', { classe: 'estado' });
    const subitens = criarElemento('button', {
      type: 'button', classe: 'acao-discreta', hidden: true, texto: 'Liberar também os subitens',
      aoClicar: () => {
        for (const id of descendentesDoItem(itens, item.id)) for (const i of itens.find(x => x.id === id).paragrafos) liberados.add(i);
        atualizar();
      },
    });
    const grupo = criarElemento('div', { classe: 'grupo-item', dados: { item: item.id }, style: `margin-left:${Math.min(item.nivel, 4) * 18}px` },
      criarElemento('div', { classe: 'titulo-item' },
        criarElemento('label', {}, caixa, ` ${rotuloDoItem(item)}`, estado), subitens));
    const dobrar = item.paragrafos.length > LINHAS_ANTES_DE_DOBRAR;
    const escondidos = [];
    item.paragrafos.forEach((indice, k) => {
      const caixaLinha = criarElemento('input', {
        type: 'checkbox', 'aria-label': 'A IA pode alterar este parágrafo',
        aoMudar: () => { (caixaLinha.checked ? liberados.add(indice) : liberados.delete(indice)); atualizar(); },
      });
      const linha = criarElemento('div', { classe: 'par-marcavel', dados: { paragrafo: indice } },
        criarElemento('label', {}, caixaLinha, criarElemento('span', { classe: 'texto-paragrafo', texto: porIndice.get(indice).texto })));
      linhas.set(indice, { linha, caixa: caixaLinha });
      if (dobrar && k >= 12 && k < item.paragrafos.length - 2) { linha.hidden = true; escondidos.push(linha); }
      grupo.append(linha);
      if (dobrar && k === 11) {
        const abrir = criarElemento('button', {
          type: 'button', classe: 'dobra', dados: { expandir: '' },
          texto: `Mostrar as outras ${item.paragrafos.length - 14} linhas`,
          aoClicar: () => { for (const e of escondidos) e.hidden = false; abrir.remove(); },
        });
        grupo.append(abrir);
      }
    });
    grupos.set(item.id, { caixa, estado, subitens });
    folha.append(grupo);
  }

  atualizar();
  return { contador, folha };
}

return { criarMarcacao };
})();
// ---- src/interface/telas/adicionar-topico.js ----
const { telaAdicionarTopico } = (() => {
// Tela Adicionar tópico (T4.3): colar o texto "antes" e marcar o que a IA pode alterar (P3).
// A colagem guarda o texto simples e a formatação (HTML) exatamente como vieram; o HTML nunca
// entra na página (AGENTS.md, proibição 3). A marcação é por parágrafo; o item agrupa.

// Acima disto, provavelmente a página inteira foi copiada por engano.
const PARAGRAFOS_DEMAIS = 3000;

const INSTRUCAO_COPIAR = 'No sistema, abra o tópico, clique dentro do texto, aperte Ctrl+A e depois Ctrl+C. '
  + 'Volte aqui e aperte Ctrl+V.';

async function telaAdicionarTopico(contexto, idDaVerificacao) {
  const { verificacao: verificacao, problema } = await carregarComValidacao(contexto, idDaVerificacao);
  if (problema) return telaDanificada(problema, 'adicionar-topico');
  if (!verificacao) {
    return criarElemento('section', { classe: 'tela', dados: { tela: 'adicionar-topico' } },
      criarElemento('a', { classe: 'voltar', href: '#/', texto: '← Início' }),
      criarElemento('h1', { texto: 'Verificação não encontrada' }));
  }
  const lida = verificacao.atualizadaEm;
  const rotaDaVerificacao = `/verificacao/${encodeURIComponent(verificacao.id)}`;
  const corpo = criarElemento('div');
  let colagem = null; // { texto, html, divisao, itens }
  const liberados = new Set();

  // ---------- passo 1: colar ----------
  function mostrarZona(mensagem = '') {
    colagem = null;
    liberados.clear();
    const zona = criarZonaDeColar('O texto aparece logo abaixo, para você marcar o que a IA pode alterar.', 'instrucao-colar');
    substituirConteudo(corpo,
      criarElemento('p', { id: 'instrucao-colar', classe: 'instrucao', texto: INSTRUCAO_COPIAR }),
      zona,
      criarEscolhaDeArquivo(receber),
      mensagem ? criarElemento('p', { classe: 'mensagem-erro', role: 'alert', texto: mensagem }) : null);
    zona.focus();
  }

  // A colagem e o arquivo aberto chegam aqui do mesmo jeito.
  const receber = ({ texto, html, aviso = null }) => {
    if (colagem) return false; // na marcação, só "Colar de novo" troca o texto
    const divisao = dividirParagrafos(texto);
    if (divisao.paragrafos.length === 0) {
      mostrarZona(MENSAGEM_COLAGEM_SEM_TEXTO);
      return true;
    }
    colagem = { texto, html, divisao, aviso };
    mostrarMarcacao();
    return true;
  };
  ouvirColagem(contexto, receber);

  // ---------- passo 2: marcar ----------
  function mostrarMarcacao() {
    const total = colagem.divisao.paragrafos.length;
    const mensagem = criarElemento('p', { classe: 'mensagem-erro', role: 'alert' });
    const campoNome = criarElemento('input', {
      type: 'text', id: 'nome-topico', value: sugerirNomeDeTopico(colagem.texto), maxlength: 200, autocomplete: 'off',
    });
    const { contador, folha } = criarMarcacao(colagem.divisao, liberados);

    async function salvar() {
      const agora = agoraISO();
      const idDoTopico = novoId('t');
      if (semInvisiveis(campoNome.value) === '') { mensagem.textContent = 'Dê um nome ao tópico.'; campoNome.focus(); return; }
      let nova = adicionarTopico(verificacao, { id: idDoTopico, texto: colagem.texto, html: colagem.html, agora });
      nova = renomearTopico(nova, idDoTopico, campoNome.value, agora);
      nova = definirLiberados(nova, idDoTopico, [...liberados], agora);
      if (await contexto.salvar(nova, lida)) contexto.navegar(rotaDaVerificacao);
      else mensagem.textContent = contexto.tomarAviso() || 'Não foi possível guardar o tópico.';
    }

    const grande = total > PARAGRAFOS_DEMAIS;
    substituirConteudo(corpo,
      grande ? criarElemento('div', { classe: 'aviso-pagina', role: 'alert' },
        criarElemento('strong', { texto: `Este texto é muito grande para um tópico (${total} parágrafos).` }),
        criarElemento('small', { texto: 'Confira se copiou só o texto do tópico: clique dentro do texto no sistema antes do Ctrl+A. Se estiver certo, pode seguir.' })) : null,
      colagem.aviso ? criarElemento('p', { classe: 'aviso-fixo', texto: colagem.aviso }) : null,
      criarElemento('div', { classe: 'formulario' },
        criarElemento('label', { for: 'nome-topico', texto: 'Nome do tópico' }), campoNome, mensagem),
      criarElemento('div', { classe: 'barra-fixa' },
        contador,
        criarElemento('div', { classe: 'acoes' },
          criarElemento('button', { type: 'button', classe: 'botao-principal', texto: 'Salvar tópico', aoClicar: salvar }),
          criarElemento('button', { type: 'button', texto: 'Colar de novo', aoClicar: () => mostrarZona() }),
          criarElemento('button', { type: 'button', texto: 'Cancelar', aoClicar: () => contexto.navegar(rotaDaVerificacao) }))),
      criarElemento('p', { classe: 'instrucao', texto: 'Marque a caixa de um item para liberar o item inteiro, ou a caixa ao lado de um parágrafo para liberar só ele. O que não for marcado fica protegido.' }),
      folha);
    campoNome.focus();
  }

  mostrarZona();
  return criarElemento('section', { classe: 'tela', dados: { tela: 'adicionar-topico' } },
    criarElemento('a', { classe: 'voltar', href: `#${rotaDaVerificacao}`, texto: `← ${verificacao.nome}` }),
    criarElemento('h1', { texto: 'Adicionar tópico' }),
    criarElemento('p', { classe: 'descricao', texto: 'Cole o texto do tópico como ele está no sistema, antes de pedir à IA.' }),
    corpo);
}

return { telaAdicionarTopico };
})();
// ---- src/interface/telas/ajustar-liberacoes.js ----
const { telaAjustarLiberacoes } = (() => {
// Tela Ajustar liberações (T5.3): mudar o que a IA pode alterar num tópico já criado, só enquanto
// o texto depois não foi colado (decisão do arquiteto em 18/10/2026). A regra mora no domínio
// (definirLiberados recusa); esta tela só não oferece o que o domínio recusaria.

const MENSAGEM_JA_COLADO = 'O texto depois deste tópico já foi colado. As liberações não mudam depois disso, para a conferência valer.';

async function telaAjustarLiberacoes(contexto, idDaVerificacao, idDoTopico) {
  const { verificacao: verificacao, problema } = await carregarComValidacao(contexto, idDaVerificacao);
  if (problema) return telaDanificada(problema, 'ajustar-liberacoes');
  const topico = verificacao && verificacao.topicos.find(t => t.id === idDoTopico);
  const rotaDaVerificacao = `#/verificacao/${encodeURIComponent(idDaVerificacao)}`;
  const tela = (...filhos) => criarElemento('section', { classe: 'tela', dados: { tela: 'ajustar-liberacoes' } },
    criarElemento('a', { classe: 'voltar', href: verificacao ? rotaDaVerificacao : '#/', texto: verificacao ? `← ${verificacao.nome}` : '← Início' }),
    ...filhos);
  if (!topico) {
    return tela(
      criarElemento('h1', { texto: 'Tópico não encontrado' }),
      criarElemento('p', { classe: 'descricao', texto: 'Ele pode ter sido removido desta verificação.' }));
  }
  const rotaDoTopico = `/verificacao/${encodeURIComponent(idDaVerificacao)}/topico/${encodeURIComponent(idDoTopico)}`;
  if (topico.depois !== null) {
    return tela(
      criarElemento('h1', { texto: 'Ajustar liberações' }),
      criarElemento('p', { classe: 'descricao', texto: topico.nome }),
      criarElemento('p', { classe: 'aviso-fixo', texto: MENSAGEM_JA_COLADO }),
      criarElemento('div', { classe: 'acoes' },
        criarElemento('a', { classe: 'botao', href: `#${rotaDoTopico}`, texto: 'Ver resultado' })));
  }

  const lida = verificacao.atualizadaEm;
  const liberados = new Set(topico.liberados);
  const { contador, folha } = criarMarcacao(dividirParagrafos(topico.antes.texto), liberados);
  const mensagem = criarElemento('p', { classe: 'mensagem-erro', role: 'alert' });
  const voltar = () => contexto.navegar(`${rotaDoTopico}/depois`);

  async function salvar() {
    // Relê antes de gravar: se outra aba colou o depois enquanto esta ajustava, o domínio recusa
    // e o depois colado lá não se perde.
    const { verificacao: atual, problema: danificada } = await carregarComValidacao(contexto, idDaVerificacao);
    if (danificada || !atual || !atual.topicos.some(t => t.id === idDoTopico)) {
      mensagem.textContent = 'Este tópico não existe mais ou foi danificado. Volte à verificação.';
      return;
    }
    if (atual.topicos.find(t => t.id === idDoTopico).depois !== null) {
      mensagem.textContent = MENSAGEM_JA_COLADO;
      return;
    }
    const nova = definirLiberados(atual, idDoTopico, [...liberados], agoraISO());
    if (await contexto.salvar(nova, lida)) voltar();
    else mensagem.textContent = contexto.tomarAviso() || 'Não foi possível guardar as liberações.';
  }

  return tela(
    criarElemento('h1', { texto: 'Ajustar liberações' }),
    criarElemento('p', { classe: 'descricao', texto: topico.nome }),
    criarElemento('div', { classe: 'barra-fixa' },
      contador,
      criarElemento('div', { classe: 'acoes' },
        criarElemento('button', { type: 'button', classe: 'botao-principal', texto: 'Salvar liberações', aoClicar: salvar }),
        criarElemento('button', { type: 'button', texto: 'Cancelar', aoClicar: voltar }))),
    mensagem,
    criarElemento('p', { classe: 'instrucao', texto: 'Marque a caixa de um item para liberar o item inteiro, ou a caixa ao lado de um parágrafo para liberar só ele. O que não for marcado fica protegido. Depois que o texto depois for colado, as liberações não mudam mais.' }),
    folha);
}

return { telaAjustarLiberacoes };
})();
// ---- src/interface/telas/conferir-topico.js ----
const { telaConferirTopico } = (() => {
// Tela Conferir tópico (T4.4): colar o texto "depois" e ir ao resultado.
// Se o texto não parece ser deste tópico (plano 6.6), avisa ANTES de gravar: assim uma colagem da
// tela errada não substitui um "depois" que já existia. A pessoa cola de novo ou confirma.

async function telaConferirTopico(contexto, idDaVerificacao, idDoTopico) {
  const { verificacao: verificacao, problema } = await carregarComValidacao(contexto, idDaVerificacao);
  if (problema) return telaDanificada(problema, 'conferir-topico');
  const topico = verificacao && verificacao.topicos.find(t => t.id === idDoTopico);
  const rotaDaVerificacao = `#/verificacao/${encodeURIComponent(idDaVerificacao)}`;
  if (!topico) {
    return criarElemento('section', { classe: 'tela', dados: { tela: 'conferir-topico' } },
      criarElemento('a', { classe: 'voltar', href: verificacao ? rotaDaVerificacao : '#/', texto: verificacao ? `← ${verificacao.nome}` : '← Início' }),
      criarElemento('h1', { texto: 'Tópico não encontrado' }),
      criarElemento('p', { classe: 'descricao', texto: 'Ele pode ter sido removido desta verificação.' }));
  }
  const lida = verificacao.atualizadaEm;
  const rotaDoResultado = `/verificacao/${encodeURIComponent(idDaVerificacao)}/topico/${encodeURIComponent(idDoTopico)}`;
  const corpo = criarElemento('div');
  let suspeita = null; // colagem que parece de outro tópico, esperando a pessoa decidir

  async function gravar(texto, html, confirmado) {
    const agora = agoraISO();
    let nova = colarDepois(verificacao, idDoTopico, { texto, html, agora });
    if (confirmado) nova = confirmarTopicoDiferente(nova, idDoTopico, agora);
    if (await contexto.salvar(nova, lida)) contexto.navegar(rotaDoResultado);
    else mostrarZona(contexto.tomarAviso() || 'Não foi possível guardar o texto.');
  }

  function mostrarZona(mensagem = '') {
    suspeita = null;
    substituirConteudo(corpo,
      topico.depois
        ? criarElemento('p', { classe: 'aviso-fixo', texto: `Este tópico já tem um texto depois, colado em ${formatarDataHora(topico.depois.coladoEm)}. Colar de novo substitui.` })
        // Ainda dá para ajustar as liberações (T5.3): só até o depois ser colado.
        : criarElemento('p', { classe: 'aviso-fixo' },
          `${topico.liberados.length} de ${dividirParagrafos(topico.antes.texto).paragrafos.length} parágrafos liberados para a IA alterar. `,
          criarElemento('a', { href: `#${rotaDoResultado}/liberar`, texto: 'Ajustar liberações' })),
      criarElemento('p', { id: 'instrucao-colar', classe: 'instrucao', texto: 'Depois que a IA terminou: no sistema, abra este mesmo tópico, clique dentro do texto, aperte Ctrl+A e depois Ctrl+C. Volte aqui e aperte Ctrl+V.' }),
      criarZonaDeColar('O resultado aparece logo em seguida.', 'instrucao-colar'),
      criarEscolhaDeArquivo(receber),
      mensagem ? criarElemento('p', { classe: 'mensagem-erro', role: 'alert', texto: mensagem }) : null);
  }

  function mostrarSuspeita(fracao) {
    const percentual = Math.round(fracao * 100);
    const encontrados = percentual === 0
      ? 'Nenhum parágrafo do texto antes foi encontrado nele.'
      : `Só ${percentual}% dos parágrafos do texto antes foram encontrados nele.`;
    substituirConteudo(corpo,
      criarElemento('div', { classe: 'aviso-pagina', role: 'alert' },
        criarElemento('strong', { texto: `Este texto não parece ser do tópico "${topico.nome}".` }),
        criarElemento('p', { style: 'margin:6px 0 0', texto: `${encontrados} Confira se copiou a tela certa no sistema.` })),
      criarElemento('div', { classe: 'acoes' },
        criarElemento('button', { type: 'button', classe: 'botao-principal', texto: 'Colar de novo', aoClicar: () => mostrarZona() }),
        criarElemento('button', { type: 'button', texto: 'É este mesmo, mostrar resultado',
          aoClicar: () => gravar(suspeita.texto, suspeita.html, true) })));
  }

  // A colagem e o arquivo aberto chegam aqui do mesmo jeito.
  const receber = ({ texto, html }) => {
    if (suspeita) return false; // decidindo sobre a colagem anterior
    const depois = dividirParagrafos(texto);
    if (depois.paragrafos.length === 0) { mostrarZona(MENSAGEM_COLAGEM_SEM_TEXTO); return true; }
    const classificacao = classificarTopico(dividirParagrafos(topico.antes.texto), depois, topico.liberados);

    criarElemento('a', { classe: 'voltar', href: rotaDaVerificacao, texto: `← ${verificacao.nome}` }),
    criarElemento('h1', { texto: 'Colar o texto depois' }),

}

const { telaInicio } = (() => {
// Tela Início (T4.1): as Verificações guardadas, criar uma nova, excluir, e onde os dados ficam.

// Pós-MVP (decisão do arquiteto, 20/10/2026): Verificação sem uso há mais disto ganha um aviso
// sugerindo excluir. Nunca é apagada sozinha.
const DIAS_PARA_AVISAR = 30;
const UM_DIA = 24 * 60 * 60 * 1000;
const PROIBIDOS_NO_NOME_DE_ARQUIVO = new Set([...'<>:"/|?*', String.fromCodePoint(0x5C)]);

const diasSemUso = (atualizadaEm) => Math.floor((Date.now() - Date.parse(atualizadaEm)) / UM_DIA);

// Nome de arquivo a partir do nome da Verificação, sem os caracteres que o Windows recusa.
function nomeDeArquivo(nome) {
  const limpo = [...String(nome)].map(ch => (PROIBIDOS_NO_NOME_DE_ARQUIVO.has(ch) || ch.codePointAt(0) < 32 ? ' ' : ch))
    .join('').replace(/ +/g, ' ').trim().slice(0, 80);
  return `${limpo || 'verificacao'}.conferidor`;
}

// Entrega o conteúdo como arquivo baixado pelo navegador (nada sai do computador).
function baixar(nome, conteudo) {
  const endereco = URL.createObjectURL(new Blob([conteudo], { type: 'application/octet-stream' }));
  const link = criarElemento('a', { href: endereco, download: nome, hidden: true });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(endereco), 60000);
}

// A situação de cada Verificação, por extenso (cor + forma + palavra).
function seloDaVerificacao(geral) {
  switch (geral.status) {
    case 'vazia': return criarSelo('pendente', '…', 'Nenhum tópico ainda');
    case 'em-andamento': {
      const extra = geral.comProblemas ? ` · ${geral.comProblemas} com alteração não autorizada` : '';
      return criarSelo(geral.comProblemas ? 'erro' : 'pendente', geral.comProblemas ? '✕' : '…',
        `Em andamento: ${geral.conferidos} de ${geral.total} conferidos${extra}`);
    }
    case 'problemas': return criarSelo('erro', '✕', 'Alteração não autorizada');
    case 'avisos': return criarSelo('aviso', '!', 'Com avisos');
    default: return criarSelo('ok', '✓', 'Todos os tópicos íntegros');
  }
}

function linhaDaVerificacao(resumo, contexto, aoExcluir, mostrarMensagem) {
  const situacao = criarElemento('span', { classe: 'situacao' }, criarSelo('pendente', '…', 'Calculando a situação…'));
  const topicos = resumo.quantidadeDeTopicos === 1 ? '1 tópico' : `${resumo.quantidadeDeTopicos} tópicos`;
  const linha = criarElemento('li', { dados: { verificacao: resumo.id } },
    criarElemento('span', { classe: 'nome', texto: resumo.nome }),
    criarElemento('span', { classe: 'meta', texto: `${topicos} · atualizada em ${formatarDataHora(resumo.atualizadaEm)}` }),
    situacao,
    diasSemUso(resumo.atualizadaEm) > DIAS_PARA_AVISAR
      ? criarElemento('span', { classe: 'antiga', dados: { antiga: '' },
        texto: `Sem uso há ${diasSemUso(resumo.atualizadaEm)} dias. Se não precisar mais dela, exclua: os textos ficam guardados neste computador.` })
      : null,
    criarElemento('span', { classe: 'acoes' },
      criarElemento('a', { classe: 'botao', href: `#/verificacao/${encodeURIComponent(resumo.id)}`, texto: 'Abrir' }),
      criarElemento('button', {
        texto: 'Exportar',
        aoClicar: async () => {
          const { verificacao, problema } = await carregarComValidacao(contexto, resumo.id);
          if (problema || !verificacao) { mostrarMensagem('Esta verificação está danificada e não pode ser exportada.'); return; }
          baixar(nomeDeArquivo(verificacao.nome), montarExportacao([verificacao], agoraISO()));
          mostrarMensagem(`Arquivo "${nomeDeArquivo(verificacao.nome)}" baixado. Ele leva os textos inteiros: guarde-o com o mesmo cuidado do documento.`);
        },
      }),
      criarElemento('button', {
        classe: 'botao-perigo',
        texto: 'Excluir',
        aoClicar: async () => {
          const ok = window.confirm(`Excluir a verificação "${resumo.nome}" e todos os textos dela? Isso não pode ser desfeito.`);
          if (!ok) return;
          await contexto.armazenamento.excluir(resumo.id);
          aoExcluir(linha);
        },
      })));
  // A situação exige recalcular os tópicos: chega depois, sem segurar a lista.
  setTimeout(async () => {
    const { verificacao, problema } = await carregarComValidacao(contexto, resumo.id);
    if (problema) substituirConteudo(situacao, criarSelo('erro', '✕', 'Não foi possível ler esta verificação (está danificada)'));
    else if (verificacao) substituirConteudo(situacao, seloDaVerificacao(resumirVerificacao(verificacao).geral));
  }, 0);

}

// Importar, exportar todas e apagar todas (pós-MVP).
function acoesEmLote(contexto, resumos, mostrarMensagem) {
  const entrada = criarElemento('input', {
    type: 'file', accept: '.conferidor,.json', hidden: true, dados: { entradaImportar: '' },
    aoMudar: async () => {
      const arquivo = entrada.files && entrada.files[0];
      entrada.value = '';
      if (!arquivo) return;
      let verificacoes;
      try {
        ({ verificacoes } = lerExportacao(await arquivo.text()));
      } catch (erro) {
        mostrarMensagem(erro && erro.paraPessoa ? erro.message : 'Não foi possível ler este arquivo.');
        return;
      }
      let importadas = 0;
      let mantidas = 0;
      for (const v of verificacoes) {
        if (await contexto.armazenamento.carregar(v.id) !== null) {
          const substituir = window.confirm(`A verificação "${v.nome}" já existe neste navegador. Substituir pela do arquivo? (Cancelar mantém a que já está aqui.)`);
          if (!substituir) { mantidas++; continue; }
        }
        await contexto.armazenamento.salvar(v);
        importadas++;
      }
      const partes = [`${importadas} ${importadas === 1 ? 'verificação importada' : 'verificações importadas'}`];
      if (mantidas) partes.push(`${mantidas} ${mantidas === 1 ? 'mantida' : 'mantidas'} como estava`);
      contexto.avisar(`${partes.join(', ')}.`);
      contexto.redesenhar();
    },
  });
  const botoes = [
    criarElemento('button', { type: 'button', texto: 'Importar de arquivo', aoClicar: () => entrada.click() }),
    entrada,
  ];
  if (resumos.length) {
    botoes.push(
      criarElemento('button', {
        type: 'button', texto: 'Exportar todas',
        aoClicar: async () => {
          const todas = [];
          for (const r of resumos) {
            const { verificacao, problema } = await carregarComValidacao(contexto, r.id);
            if (verificacao && !problema) todas.push(verificacao);
          }
          if (!todas.length) { mostrarMensagem('Nenhuma verificação pôde ser exportada.'); return; }
          const nome = `verificacoes-${agoraISO().slice(0, 10)}.conferidor`;
          baixar(nome, montarExportacao(todas, agoraISO()));
          const puladas = resumos.length - todas.length;
          const fora = puladas ? ` (${puladas} danificada${puladas === 1 ? '' : 's'} ficou de fora)` : '';
          mostrarMensagem(`Arquivo "${nome}" baixado com ${todas.length} ${todas.length === 1 ? 'verificação' : 'verificações'}${fora}. Ele leva os textos inteiros: guarde-o com o mesmo cuidado do documento.`);
        },
      }),
      criarElemento('button', {
        type: 'button', classe: 'botao-perigo', texto: 'Apagar todas',
        aoClicar: async () => {
          const ok = window.confirm(`Apagar as ${resumos.length} verificações e todos os textos delas deste navegador? Isso não pode ser desfeito.`);
          if (!ok) return;
          for (const r of resumos) await contexto.armazenamento.excluir(r.id);
          contexto.avisar('Todas as verificações foram apagadas deste navegador.');
          contexto.redesenhar();
        },
      }));
  }
  return criarElemento('div', { classe: 'acoes acoes-em-lote' }, botoes);
}

// ---- src/interface/telas/resultado.js ----
const { telaResultado } = (() => {
// Tela Resultado do tópico (T4.5): o documento anotado, como aprovado na rodada de design.
// O tópico inteiro na ordem do texto, com as mudanças marcadas no lugar (riscado = saiu,
// sublinhado = entrou), 3 parágrafos de contexto em volta de cada mudança e o resto dobrado.

const CONTEXTO = 3;
const GRAVIDADE = {
  erro: { palavra: 'Alteração não autorizada', forma: '✕', posto: 3 },
  aviso: { palavra: 'Aviso', forma: '!', posto: 2 },
  info: { palavra: 'Parte liberada', forma: 'i', posto: 1 },
};
const NOMES_INVISIVEIS = new Map([
  [0x20, 'espaço comum'], [0x09, 'tabulação'], [0xA0, 'espaço não separável'], [0x202F, 'espaço não separável estreito'],
  [0x200B, 'caractere de largura zero'], [0x200C, 'caractere de largura zero'], [0x200D, 'caractere de largura zero'],
  [0x2060, 'caractere de largura zero'], [0xFEFF, 'marca invisível'],
]);
const MARCADOR_DE_COMENTARIO = /\[\p{Lu}{1,4}\d{1,3}\]/u;

const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;

// "Item 1.9" → "item 1.9", para caber no meio da frase; rótulos em maiúsculas ficam como estão.
function noMeioDaFrase(rotulo) {
  return /^(Item|Inciso|Alínea|Abertura|Parágrafo)\b/.test(rotulo) ? rotulo[0].toLowerCase() + rotulo.slice(1) : rotulo;
}

// Achados do domínio → blocos da tela. "Sumiu" seguido de "novo" vira "trocado por" (T2.7).
function montarBlocos(achados) {
  const blocos = [];
  for (let i = 0; i < achados.length; i++) {
    const a = achados[i];
    const b = achados[i + 1];
    if (a.tipo === 'sumiu' && b && b.tipo === 'novo') {
      const gravidade = GRAVIDADE[a.gravidade].posto >= GRAVIDADE[b.gravidade].posto ? a.gravidade : b.gravidade;
      blocos.push({ ...a, tipo: 'trocado', gravidade, depois: b.depois });
      i++;
    } else if (a.tipo === 'renumerado' && !a.renumeracao.inicio) {
      blocos.push({ ...a, doGrupo: true });
    } else {
      blocos.push({ ...a, semMudanca: a.gravidade === 'ok' || (a.gravidade === 'info' && a.tipo === 'identico') });
    }
  }
  return blocos;
}

function nomesDosInvisiveis(texto) {
  const nomes = [];
  for (const ch of texto) {
    const nome = NOMES_INVISIVEIS.get(ch.codePointAt(0)) || (/\s/.test(ch) ? 'espaço especial' : null);
    if (nome && !nomes.includes(nome)) nomes.push(nome);
  }
  return nomes;
}

function fraseDoInvisivel(trechos) {
  const juntar = (tipo) => nomesDosInvisiveis(trechos.filter(t => t.tipo === tipo).map(t => t.texto).join(''));
  const saiu = juntar('removido');
  const entrou = juntar('inserido');
  const partes = [];
  if (saiu.length) partes.push(`Saiu: ${saiu.join(', ')}.`);
  if (entrou.length) partes.push(`Entrou: ${entrou.join(', ')}.`);
  return `${partes.join(' ') || 'Só espaços ou caracteres invisíveis mudaram.'} O texto visível é o mesmo.`;
}

function fraseDoComentario(trechos) {
  const tem = (tipo) => trechos.some(t => t.tipo === tipo && MARCADOR_DE_COMENTARIO.test(t.texto));
  if (tem('inserido') && tem('removido')) return 'Marcador de comentário trocado';
  return tem('inserido') ? 'Marcador de comentário acrescentado' : 'Marcador de comentário removido';
}

const listar = (nomes) => (nomes.length <= 1 ? nomes.join('') : `${nomes.slice(0, -1).join(', ')} e ${nomes[nomes.length - 1]}`);

// "“12 meses” ganhou negrito; “prazo” perdeu itálico e mudou de cor."
function fraseDaFormatacao(mudancas) {
  return `${mudancas.map((m) => {
    const partes = [];
    if (m.saiu.length) partes.push(`perdeu ${listar(m.saiu)}`);
    if (m.entrou.length) partes.push(`ganhou ${listar(m.entrou)}`);
    if (m.corMudou) partes.push('mudou de cor');
    return `“${m.texto}” ${listar(partes)}`;
  }).join('; ')}.`;
}

// "tabela 1, linha 3, coluna QUANTIDADE"; a linha do cabeçalho não tem nome de coluna.
function fraseDaCelula(celula) {
  if (!celula) return '';
  const coluna = celula.nomeDaColuna ? `coluna ${celula.nomeDaColuna}` : `coluna ${celula.coluna}`;
  return `tabela ${celula.tabela}, linha ${celula.linha}, ${coluna}`;
}

// Só o que mudou, para trechos curtos (ex.: célula "4→" que virou "5→"): começo e fim iguais
// ficam de fora do destaque, e a tabulação que existe dos dois lados não aparece.
function trechosDeTroca(antes, depois) {
  let inicio = 0;
  while (inicio < antes.length && inicio < depois.length && antes[inicio] === depois[inicio]) inicio++;
  let fim = 0;
  while (fim < antes.length - inicio && fim < depois.length - inicio && antes[antes.length - 1 - fim] === depois[depois.length - 1 - fim]) fim++;
  return [
    { tipo: 'igual', texto: antes.slice(0, inicio) },
    { tipo: 'removido', texto: antes.slice(inicio, antes.length - fim) },
    { tipo: 'inserido', texto: depois.slice(inicio, depois.length - fim) },
    { tipo: 'igual', texto: antes.slice(antes.length - fim) },
  ].filter(t => t.texto);
}

function desenharTrechos(trechos) {
  return trechos.map(t => (t.tipo === 'igual' ? t.texto
    : criarElemento(t.tipo === 'removido' ? 'del' : 'ins', { texto: destacarInvisiveis(t.texto) })));
}

function botaoCopiar(texto) {
  const resposta = criarElemento('span', { classe: 'resposta-copia', 'aria-live': 'polite' });
  const botao = criarElemento('button', {
    type: 'button',
    texto: 'Copiar texto original',
    aoClicar: async () => {
      try {
        if (!navigator.clipboard) throw new Error('sem área de transferência');
        await navigator.clipboard.writeText(texto);
        resposta.replaceChildren('Copiado. Agora cole no sistema, no lugar do texto alterado.');
      } catch {
        const area = criarElemento('textarea', { readonly: true, rows: 3, dados: { copiaManual: '' }, 'aria-label': 'Texto original para copiar' });
        area.value = texto;
        resposta.replaceChildren(criarElemento('span', { texto: 'O navegador não deixou copiar sozinho. Selecione o texto abaixo e aperte Ctrl+C:' }), area);
        area.focus();
        area.select();
      }
    },
  });
  return criarElemento('div', { classe: 'acoes-bloco' }, botao, resposta);
}

async function telaResultado(contexto, idDaVerificacao, idDoTopico) {
  const { verificacao: verificacao, problema } = await carregarComValidacao(contexto, idDaVerificacao);
  if (problema) return telaDanificada(problema, 'resultado');
  const topico = verificacao && verificacao.topicos.find(t => t.id === idDoTopico);
  const rotaDaVerificacao = `#/verificacao/${encodeURIComponent(idDaVerificacao)}`;
  const rotaDoDepois = `${rotaDaVerificacao}/topico/${encodeURIComponent(idDoTopico)}/depois`;
  const secao = (...filhos) => criarElemento('section', { classe: 'tela', dados: { tela: 'resultado' } },
    criarElemento('a', { classe: 'voltar', href: verificacao ? rotaDaVerificacao : '#/', texto: verificacao ? `← ${verificacao.nome}` : '← Início' }),
    ...filhos);
  if (!topico) return secao(criarElemento('h1', { texto: 'Tópico não encontrado' }));

  const titulo = criarElemento('h1', { texto: topico.nome });
  const { classificacao, status } = conferirTopico(topico);

  if (status.status === 'aguardando') {
    return secao(titulo,
      criarElemento('p', { classe: 'veredito' }, criarSelo('pendente', '…', 'Aguardando o texto depois')),
      criarElemento('p', { texto: 'Depois que a IA terminar, cole aqui o texto do tópico como ficou no sistema.' }),
      criarElemento('a', { classe: 'botao botao-principal', href: rotaDoDepois, texto: 'Colar texto depois' }));
  }

  if (status.status === 'confirmar-topico') {
    const percentual = Math.round(classificacao.fracaoPareada * 100);
    return secao(titulo,
      criarElemento('div', { classe: 'aviso-pagina', role: 'alert' },
        criarElemento('strong', { texto: `O texto depois não parece ser do tópico "${topico.nome}".` }),
        criarElemento('p', { style: 'margin:6px 0 0', texto: `${percentual === 0 ? 'Nenhum parágrafo do texto antes foi encontrado nele.' : `Só ${percentual}% dos parágrafos do texto antes foram encontrados nele.`} Confira se copiou a tela certa no sistema.` })),
      criarElemento('div', { classe: 'acoes' },
        criarElemento('a', { classe: 'botao botao-principal', href: rotaDoDepois, texto: 'Colar de novo' }),
        criarElemento('button', {
          type: 'button', texto: 'É este mesmo, mostrar resultado',
          aoClicar: async () => {
            await contexto.salvar(confirmarTopicoDiferente(verificacao, idDoTopico, agoraISO()), verificacao.atualizadaEm);
            contexto.redesenhar();
          },
        })));
  }

  const textosAntes = dividirParagrafos(topico.antes.texto).paragrafos.map(p => p.texto);
  const textosDepois = dividirParagrafos(topico.depois.texto).paragrafos.map(p => p.texto);
  const itens = new Map(agruparItens(dividirParagrafos(topico.antes.texto)).map(i => [i.id, i]));
  const rotulo = (idDoItem) => (idDoItem === null || idDoItem === undefined ? 'Início do tópico' : rotuloDoItem(itens.get(idDoItem)));
  const blocos = montarBlocos(classificacao.achados);
  if (classificacao.separadorFinal) {
    blocos.push({ tipo: 'separador-final', gravidade: classificacao.separadorFinal.gravidade, antes: null, depois: null });
  }

  // O item e, quando houver, a célula da tabela: "Item 1.1 (tabela 1, linha 3, coluna QUANTIDADE)".
  const lugar = (b) => (b.celula ? `${rotulo(b.item)} (${fraseDaCelula(b.celula)})` : rotulo(b.item));
  const tambemFormatacao = (b) => (b.formatacao && b.tipo !== 'formatacao' ? ` Também mudou a formatação: ${fraseDaFormatacao(b.formatacao)}` : '');

  function descricao(b) {
    return descricaoSemFormatacao(b) + tambemFormatacao(b);
  }

  function descricaoSemFormatacao(b) {
    switch (b.tipo) {
      case 'novo': {
        const marcador = detectarMarcador(textosDepois[b.depois]);
        const onde = b.item === null || b.item === undefined ? 'no início do tópico' : `depois do ${noMeioDaFrase(rotulo(b.item))}`;
        const celula = b.celula ? ` (${fraseDaCelula(b.celula)})` : '';
        return (marcador ? `${rotuloDoItem({ tipo: 'marcado', marcador })} novo, ${onde}`.replace(/^Item (\S+) novo/, 'Item novo $1') : `Texto novo, ${onde}`) + celula;
      }
      case 'separador-final': return 'As linhas em branco no fim do tópico mudaram';
      case 'alterado': return `${lugar(b)} — Texto alterado`;
      case 'sumiu': return `${lugar(b)} — Parágrafo apagado`;
      case 'trocado': return `${lugar(b)} — Trocado por outro texto`;
      case 'movido': return `${lugar(b)} — Fora da ordem original: o texto é o mesmo, mudou de lugar.`;
      case 'invisivel': return `${lugar(b)} — ${fraseDoInvisivel(b.trechos)}`;
      case 'comentario': return `${lugar(b)} — ${fraseDoComentario(b.trechos)}`;
      case 'separador': return `${lugar(b)} — As linhas em branco antes deste parágrafo mudaram`;
      case 'formatacao': return `${lugar(b)} — Só a formatação mudou: ${fraseDaFormatacao(b.formatacao)}`;
      case 'renumerado': {
        const { primeiro, ultimo, delta } = b.renumeracao;
        return `Itens ${primeiro} a ${ultimo} renumerados (${delta > 0 ? '+' : ''}${delta}): só o número mudou, o texto é o mesmo`;
      }
      default: return lugar(b);
    }
  }

  function corpoDoBloco(b) {
    switch (b.tipo) {
      case 'sumiu': return [criarElemento('del', { texto: textosAntes[b.antes] })];
      case 'novo': return [criarElemento('ins', { texto: textosDepois[b.depois] })];
      case 'trocado': {
        // Texto longo: palavra a palavra (não corta palavras no meio). Célula curta ("4→" virou
        // "5→"): só os caracteres que mudaram. Reescrito por inteiro: o que saiu e o que entrou.
        const antes = textosAntes[b.antes];
        const depois = textosDepois[b.depois];
        const palavras = compararPalavras(antes, depois);
        if (palavras.semelhanca >= 0.4) return desenharTrechos(palavras.trechos);
        if (antes.length <= 40 && depois.length <= 40) return desenharTrechos(trechosDeTroca(antes, depois));
        return [criarElemento('del', { texto: antes }), ' ', criarElemento('ins', { texto: depois })];
      }
      case 'separador-final': return [];
      case 'formatacao': {
        const texto = textosDepois[b.depois];
        const partes = [];
        let pos = 0;
        for (const m of b.formatacao) {
          partes.push(texto.slice(pos, m.inicio), criarElemento('mark', { classe: 'mudou-formatacao', texto: texto.slice(m.inicio, m.fim) }));
          pos = m.fim;
        }
        partes.push(texto.slice(pos));
        return partes.filter(x => x !== '');
      }
      default: return b.trechos ? desenharTrechos(b.trechos) : [textosAntes[b.antes]];
    }
  }

  // Monta o documento: mudanças em faixa, com 3 parágrafos de contexto; o resto dobrado.
  const ehMudanca = blocos.map(b => !b.semMudanca);
  const visivel = blocos.map((_, i) => {
    for (let k = Math.max(0, i - CONTEXTO); k <= Math.min(blocos.length - 1, i + CONTEXTO); k++) if (ehMudanca[k]) return true;
    return false;
  });
  const folha = criarElemento('div', { classe: 'folha folha-resultado' });
  let dobrados = [];
  const fecharDobra = () => {
    if (!dobrados.length) return;
    const escondidos = dobrados;
    const dobra = criarElemento('button', {
      type: 'button', classe: 'dobra', dados: { dobra: escondidos.length },
      aoClicar: () => { for (const e of escondidos) e.hidden = false; dobra.remove(); },
    },
    `··· ${plural(escondidos.length, 'parágrafo sem mudança', 'parágrafos sem mudança')} `,
    criarElemento('span', { classe: 'so-tela', texto: '(mostrar) ' }),
    '···');
    escondidos[0].before(dobra);
    dobrados = [];
  };
  const contagem = { erro: 0, aviso: 0, info: 0 };
  blocos.forEach((b, i) => {
    if (b.semMudanca) {
      const p = criarElemento('p', { classe: 'par igual', dados: { semMudanca: '' }, texto: textosAntes[b.antes] });
      folha.append(p);
      if (!visivel[i]) { p.hidden = true; dobrados.push(p); } else fecharDobra();
      return;
    }
    fecharDobra();
    if (b.doGrupo) {
      folha.append(criarElemento('div', { classe: 'par grupo-renumerado', dados: { grupoRenumerado: '' } },
        criarElemento('div', { classe: 'cabeca' }, `Mesma renumeração (itens ${b.renumeracao.primeiro} a ${b.renumeracao.ultimo})`),
        criarElemento('div', { classe: 'texto-bloco' }, corpoDoBloco(b))));
      return;
    }
    contagem[b.gravidade]++;
    const g = GRAVIDADE[b.gravidade];
    const podeCopiar = (b.gravidade === 'erro' || b.gravidade === 'aviso') && b.antes !== null && b.tipo !== 'movido' && b.tipo !== 'formatacao';
    folha.append(criarElemento('div', { classe: `par ${b.gravidade}`, dados: { achado: b.gravidade }, tabindex: -1 },
      criarElemento('span', { classe: `forma-margem f-${b.gravidade}`, 'aria-hidden': 'true', texto: g.forma }),
      criarElemento('div', { classe: 'cabeca' }, g.palavra, criarElemento('span', { classe: 'onde', texto: ` · ${descricao(b)}` })),
      criarElemento('div', { classe: 'texto-bloco' }, corpoDoBloco(b)),
      podeCopiar ? botaoCopiar(textosAntes[b.antes]) : null));
  });
  fecharDobra();

  let frase;
  if (contagem.erro || contagem.aviso) {
    frase = contagem.erro && contagem.aviso
      ? `${plural(contagem.erro, 'alteração não autorizada', 'alterações não autorizadas')} e ${plural(contagem.aviso, 'aviso', 'avisos')} neste tópico.`
      : contagem.erro ? `${plural(contagem.erro, 'alteração não autorizada', 'alterações não autorizadas')} neste tópico.`
        : `Nenhuma alteração não autorizada. ${plural(contagem.aviso, 'aviso', 'avisos')} para olhar.`;
  } else {
    frase = `Nada mudou fora do que foi liberado.${contagem.info ? ` ${plural(contagem.info, 'parte liberada mudou', 'partes liberadas mudaram')}.` : ''}`;
  }

  const selos = [];
  if (contagem.erro) selos.push(criarSelo('erro', '✕', plural(contagem.erro, 'alteração não autorizada', 'alterações não autorizadas')));
  if (contagem.aviso) selos.push(criarSelo('aviso', '!', plural(contagem.aviso, 'aviso', 'avisos')));
  if (contagem.info) selos.push(criarSelo('info', 'i', plural(contagem.info, 'parte liberada mudou', 'partes liberadas mudaram')));
  if (!selos.length) selos.push(criarSelo('ok', '✓', 'Íntegro'));

  const proximo = criarElemento('button', {
    type: 'button',
    texto: 'Próximo problema ↓',
    disabled: !(contagem.erro || contagem.aviso),
    aoClicar: () => {
      const problemas = [...folha.querySelectorAll('[data-achado="erro"], [data-achado="aviso"]')];
      // Com o foco num problema (ou num botão dele), vai ao seguinte; depois do último, volta ao
      // primeiro. Sem foco num problema (a pessoa rolou a página), o primeiro abaixo da barra fixa.
      // Medido na T5.3: só pela posição, o problema recém-centralizado era escolhido de novo.
      const atual = problemas.indexOf(document.activeElement && document.activeElement.closest('[data-achado]'));
      const alvo = atual >= 0
        ? problemas[(atual + 1) % problemas.length]
        : problemas.find(e => e.getBoundingClientRect().top > 120) || problemas[0];
      alvo.scrollIntoView({ block: 'center' });
      alvo.focus({ preventScroll: true });
    },
  });

  return secao(
    criarElemento('p', { classe: 'so-impressao', dados: { horaImpressao: verificacao.nome }, texto: linhaDeImpressao(verificacao.nome) }),
    titulo,
    criarElemento('p', { classe: 'veredito', texto: frase }),
    criarElemento('div', { classe: 'barra-fixa' },
      criarElemento('span', { classe: 'contagem', dados: { contagem: '' } }, selos),
      criarElemento('span', { classe: 'acoes' }, proximo,
        criarElemento('button', { type: 'button', texto: 'Imprimir', aoClicar: () => window.print() }),
        criarElemento('a', { classe: 'acao-discreta', href: rotaDoDepois, texto: 'Colar o texto depois de novo' }))),
    folha,
    criarElemento('p', { classe: 'aviso-fixo', dados: { avisoFormatacao: '' }, texto: classificacao.formatacao.comparada
      ? 'A formatação (negrito, itálico, sublinhado, tachado e cor) também foi comparada.'
      : `A formatação não foi comparada neste tópico: ${classificacao.formatacao.motivo}. Só o texto foi conferido.` }));
}

return { telaResultado };
})();
// ---- src/interface/telas/verificacao.js ----
const { telaVerificacao } = (() => {
// Tela da Verificação (T4.2): veredito, quadro de progresso (aprovado na rodada de design),
// tópicos com situação e uma ação cada; renomear; organizar (subir, descer, remover).

const SITUACAO = {
  problemas: { classe: 'erro', forma: '✕', palavra: 'Alteração não autorizada' },
  avisos: { classe: 'aviso', forma: '!', palavra: 'Com avisos' },
  integro: { classe: 'ok', forma: '✓', palavra: 'Íntegro' },
  aguardando: { classe: 'pendente', forma: '…', palavra: 'Aguardando o texto depois' },
  'confirmar-topico': { classe: 'pendente', forma: '?', palavra: 'Confirmar se é este tópico' },
};

function fraseDoVeredito(geral) {
  const topicosTem = (n) => (n === 1 ? '1 tópico tem' : `${n} tópicos têm`);
  switch (geral.status) {
    case 'vazia': return 'Nenhum tópico ainda.';
    case 'em-andamento':
      return `Em andamento: ${geral.conferidos} de ${geral.total} tópicos conferidos.`
        + (geral.comProblemas ? ` ${topicosTem(geral.comProblemas)} alteração não autorizada.` : '');
    case 'problemas': return `${topicosTem(geral.comProblemas)} alteração não autorizada.`;
    case 'avisos': return `Nenhuma alteração não autorizada. ${topicosTem(geral.comAvisos)} avisos para olhar.`;
    default: return 'Todos os tópicos íntegros.';
  }
}

// Quadro de progresso: mantido como aprovado pelo arquiteto na rodada de design.
function quadroDeProgresso(geral) {
  const partes = [['erro', geral.comProblemas], ['alerta', geral.comAvisos], ['ok', geral.integros]];
  const item = (s, n) => criarElemento('li', {}, criarSelo(SITUACAO[s].classe, SITUACAO[s].forma, SITUACAO[s].palavra), ` ${n}`);
  return criarElemento('aside', { classe: 'progresso', dados: { quadroProgresso: '' } },
    criarElemento('strong', { texto: `${geral.conferidos} de ${geral.total} conferidos` }),
    criarElemento('div', { classe: 'barra', 'aria-hidden': 'true' },
      partes.map(([cor, n]) => criarElemento('span', { style: `width:${(n / geral.total) * 100}%;background:var(--${cor})` }))),
    criarElemento('ul', { classe: 'legenda' },
      item('problemas', geral.comProblemas), item('avisos', geral.comAvisos), item('integro', geral.integros),
      item('aguardando', geral.pendentes)));
}

function acaoDoTopico(idDaVerificacao, topico) {
  const base = `#/verificacao/${encodeURIComponent(idDaVerificacao)}/topico/${encodeURIComponent(topico.id)}`;
  switch (topico.status) {
    case 'aguardando': return criarElemento('a', { classe: 'botao botao-principal', href: `${base}/depois`, texto: 'Colar texto depois' });
    case 'confirmar-topico': return criarElemento('a', { classe: 'botao botao-principal', href: base, texto: 'Confirmar tópico' });
    case 'integro': return criarElemento('a', { classe: 'acao-discreta', href: base, texto: 'Ver resultado' });
    default: return criarElemento('a', { classe: 'botao', href: base, texto: 'Ver resultado' });
  }
}

async function telaVerificacao(contexto, id) {
  const { verificacao: verificacao, problema } = await carregarComValidacao(contexto, id);
  if (problema) return telaDanificada(problema, 'verificacao');
  const voltar = criarElemento('a', { classe: 'voltar', href: '#/', texto: '← Início' });
  if (!verificacao) {
    return criarElemento('section', { classe: 'tela', dados: { tela: 'verificacao' } }, voltar,
      criarElemento('h1', { texto: 'Verificação não encontrada' }),
      criarElemento('p', { classe: 'descricao', texto: 'Ela pode ter sido excluída, ou ter ficado guardada em outro navegador.' }));
  }

  const lida = verificacao.atualizadaEm; // para saber, ao gravar, se outra aba mexeu nela
  const { topicos, geral } = resumirVerificacao(verificacao);
  const estado = contexto.estado;
  const organizando = estado.organizandoVerificacao === id;
  const aviso = contexto.tomarAviso();

  const gravar = async (nova) => {
    await contexto.salvar(nova, lida);
    await contexto.redesenhar();
  };

  // Renomear
  const mensagemNome = criarElemento('p', { classe: 'mensagem-erro', role: 'alert' });
  const campoNome = criarElemento('input', { type: 'text', id: 'novo-nome-verificacao', value: verificacao.nome, maxlength: 200, autocomplete: 'off' });
  const formularioNome = criarElemento('form', {
    classe: 'formulario',
    hidden: true,
    aoEnviar: async (evento) => {
      evento.preventDefault();
      let renomeada;
      try {
        renomeada = renomearVerificacao(verificacao, campoNome.value, agoraISO());
      } catch (erro) {
        if (erro instanceof RangeError) { mensagemNome.textContent = 'Dê um nome à verificação.'; campoNome.focus(); return; }
        throw erro;
      }
      await gravar(renomeada);
    },
  },
  criarElemento('label', { for: 'novo-nome-verificacao', texto: 'Novo nome da verificação' }),
  campoNome,
  criarElemento('div', { classe: 'acoes' },
    criarElemento('button', { type: 'submit', classe: 'botao-principal', texto: 'Salvar nome' }),
    criarElemento('button', { type: 'button', texto: 'Cancelar', aoClicar: () => { formularioNome.hidden = true; } })),
  mensagemNome);

  // Renomear um tópico (no modo organizar): o nome vira um campo, com Salvar e Cancelar.
  function nomeEditavel(t) {
    const mensagem = criarElemento('span', { classe: 'mensagem-erro', role: 'alert' });
    const campo = criarElemento('input', { type: 'text', value: t.nome, maxlength: 200, 'aria-label': 'Novo nome do tópico' });
    return criarElemento('form', {
      classe: 'renomear-topico',
      aoEnviar: async (evento) => {
        evento.preventDefault();
        let nova;
        try {
          nova = renomearTopico(verificacao, t.id, campo.value, agoraISO());
        } catch (erro) {
          if (erro instanceof RangeError) { mensagem.textContent = 'Dê um nome ao tópico.'; return; }
          throw erro;
        }
        estado.renomeandoTopico = null;
        await gravar(nova);
      },
    },
    campo,
    criarElemento('button', { type: 'submit', classe: 'botao-principal', texto: 'Salvar' }),
    criarElemento('button', { type: 'button', texto: 'Cancelar', aoClicar: () => { estado.renomeandoTopico = null; contexto.redesenhar(); } }),
    mensagem);
  }

  // Tópicos
  const linhas = topicos.map((t, posicao) => {
    const s = SITUACAO[t.status];
    const renomeando = organizando && estado.renomeandoTopico === t.id;
    const controles = organizando
      ? criarElemento('span', { classe: 'organizar' },
        criarElemento('button', { type: 'button', texto: 'Renomear', hidden: renomeando,
          aoClicar: () => { estado.renomeandoTopico = t.id; contexto.redesenhar(); } }),
        criarElemento('button', { type: 'button', texto: 'Subir', disabled: posicao === 0,
          aoClicar: () => gravar(moverTopico(verificacao, t.id, posicao - 1, agoraISO())) }),
        criarElemento('button', { type: 'button', texto: 'Descer', disabled: posicao === topicos.length - 1,
          aoClicar: () => gravar(moverTopico(verificacao, t.id, posicao + 1, agoraISO())) }),
        criarElemento('button', { type: 'button', classe: 'botao-perigo', texto: 'Remover',
          aoClicar: () => {
            if (window.confirm(`Remover o tópico "${t.nome}" desta verificação? Os textos dele serão apagados.`)) {
              gravar(removerTopico(verificacao, t.id, agoraISO()));
            }
          } }))
      : acaoDoTopico(id, t);
    return criarElemento('li', { dados: { topico: t.id } },
      criarElemento('span', { classe: `forma-margem m-${s.classe}`, 'aria-hidden': 'true', texto: s.forma }),
      renomeando ? nomeEditavel(t) : criarElemento('span', { classe: 'nome', texto: t.nome }),
      criarElemento('span', { classe: `situacao m-${s.classe}`, texto: s.palavra }),
      controles);
  });

  const adicionar = criarElemento('a', {
    classe: 'botao botao-principal', href: `#/verificacao/${encodeURIComponent(id)}/novo-topico`, texto: 'Adicionar tópico',
  });

  const conteudoPrincipal = topicos.length
    ? [
      criarElemento('ol', { classe: 'sumario' }, linhas),
      criarElemento('div', { classe: 'acoes', style: 'margin-top:12px' },
        adicionar,
        criarElemento('button', { type: 'button', texto: 'Imprimir', aoClicar: () => window.print() }),
        criarElemento('button', {
          type: 'button',
          texto: organizando ? 'Concluir organização' : 'Organizar tópicos',
          aoClicar: () => { estado.organizandoVerificacao = organizando ? null : id; contexto.redesenhar(); },
        })),
    ]
    : [criarElemento('div', { classe: 'vazio' },
      criarElemento('p', { texto: 'Nenhum tópico ainda.', style: 'margin:0 0 6px;font-weight:600' }),
      criarElemento('p', { style: 'margin:0 0 12px', texto: 'Comece pelo texto do tópico como ele está no sistema, antes de pedir à IA: clique dentro do texto, aperte Ctrl+A e depois Ctrl+C.' }),
      adicionar)];

  return criarElemento('section', { classe: 'tela', dados: { tela: 'verificacao' } },
    voltar,
    criarElemento('p', { classe: 'so-impressao', dados: { horaImpressao: verificacao.nome }, texto: linhaDeImpressao(verificacao.nome) }),
    aviso ? criarElemento('div', { classe: 'aviso-pagina', role: 'alert' }, criarElemento('strong', { texto: aviso })) : null,
    criarElemento('div', { classe: topicos.length ? 'capa' : '' },
      criarElemento('div', {},
        criarElemento('div', { classe: 'titulo-com-acao' },

function escolherTela(contexto, partes) {
